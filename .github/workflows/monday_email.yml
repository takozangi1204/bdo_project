name: Send Monday Email Reminder

on:
  schedule:
    # Every Monday 8:00 AM NZST (Sunday 20:00 UTC)
    - cron: '0 20 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  trigger-email:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Email Endpoint on Render
        run: |
          curl -i -X POST https://bdo-project.onrender.com/role_rotation/api/send-monday-reminder/


