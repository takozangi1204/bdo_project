name: Send Email Reminder Test

on:
  schedule:
    # 11:51 PM NZST (11:51 UTC)
    - cron: '51 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  trigger-email:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Email Endpoint on Render
        run: |
          curl -s -X POST https://bdo-project.onrender.com/role-rotation/api/send-monday-email/

