name: Send Monday Email Reminder

on:
  schedule:
    # Test cron (2 minutes from now)
    - cron: '11,12,13 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  trigger-email:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Email Endpoint on Render
        run: |
          curl -i -X POST https://bdo-project-app.onrender.com/role_rotation/api/send-monday-reminder/


