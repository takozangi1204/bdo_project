name: Send Email Reminder Test

on:
  schedule:
    # Test cron (every 5 minutes or schedule)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  trigger-email:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Email Endpoint on Render
        run: |
          curl -i -X POST https://bdo-project.onrender.com/role_rotation/api/send-monday-reminder/


