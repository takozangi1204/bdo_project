name: Send Email Reminders (Direct Runner)

on:
  schedule:
    # Every Friday 5:50 PM NZST (Friday 05:50 UTC)
    - cron: '50 5 * * 5'
    # Every Monday 8:00 AM NZST (Sunday 20:00 UTC)
    - cron: '0 20 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Email Reminders directly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          EMAIL_HOST: 'smtp.gmail.com'
          EMAIL_PORT: '587'
          EMAIL_USE_TLS: 'True'
          EMAIL_HOST_USER: ${{ secrets.GMAIL_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: |
          python manage.py send_friday_reminder
          python manage.py send_monday_reminder
