name: Send Monday Email Reminder (Direct Runner)

on:
  schedule:
    # 5-minute test schedule for verifying automated GitHub Actions time triggers
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monday Email Command directly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          EMAIL_HOST: 'smtp.gmail.com'
          EMAIL_PORT: '587'
          EMAIL_USE_TLS: 'True'
          EMAIL_HOST_USER: ${{ secrets.GMAIL_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: |
          python manage.py send_monday_reminder
